name: Scrape OnHockey to Sheets

on:
  schedule:
    # 17:00 UTC = 10:00 AM PDT (Vancouver summer, Mar–Nov)
    # 18:00 UTC = 10:00 AM PST (Vancouver winter, Nov–Mar)
    - cron: '0 17 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    container:
      image: image: mcr.microsoft.com/playwright:v1.63.0-jammy
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: npm install

      - name: Run scraper
        env:
          GSHEET_CLIENT_EMAIL: ${{ secrets.GSHEET_CLIENT_EMAIL }}
          GSHEET_PRIVATE_KEY: ${{ secrets.GSHEET_PRIVATE_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: node scrape.js